<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌸 Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ========== TOP BAR ========== -->
  <header class="topbar">
    <div class="topbar-left">
      <span id="clock" class="clock"></span>
      <span id="date-display" class="date-display"></span>
    </div>
    <div class="topbar-right">
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme" title="Toggle light/dark mode">
        <span id="theme-icon">🌙</span>
      </button>
      <button id="settings-btn" class="icon-btn" aria-label="Settings" title="Settings">⚙️</button>
    </div>
  </header>

  <!-- ========== GREETING ========== -->
  <section class="greeting-section">
    <h1 id="greeting" class="greeting"></h1>
    <p class="greeting-sub">🎋 Here's your dashboard for today. Stay strong! 🌸</p>
  </section>

  <!-- ========== MAIN GRID ========== -->
  <main class="dashboard-grid">

    <!-- FOCUS TIMER -->
    <section class="card timer-card" aria-label="Focus Timer">
      <h2 class="card-title">🎯 Focus Timer</h2>
      <div class="timer-display" id="timer-display" role="timer" aria-live="polite">25:00</div>
      <div class="timer-mode-tabs">
        <button class="mode-tab active" data-mode="pomodoro">Pomodoro</button>
        <button class="mode-tab" data-mode="short">Short Break</button>
        <button class="mode-tab" data-mode="long">Long Break</button>
      </div>
      <div class="timer-controls">
        <button id="timer-start" class="btn btn-primary">▶ Start</button>
        <button id="timer-stop" class="btn btn-secondary">⏸ Pause</button>
        <button id="timer-reset" class="btn btn-secondary">↩ Reset</button>
      </div>
      <div class="timer-settings">
        <label for="pomodoro-duration">⏱ Pomodoro (min):
          <input type="number" id="pomodoro-duration" class="duration-input" min="1" max="60" value="25" />
        </label>
        <label for="short-duration">☕ Short Break (min):
          <input type="number" id="short-duration" class="duration-input" min="1" max="30" value="5" />
        </label>
        <label for="long-duration">🛋 Long Break (min):
          <input type="number" id="long-duration" class="duration-input" min="1" max="60" value="15" />
        </label>
      </div>
      <p class="session-count">Sessions completed: <span id="session-count">0</span></p>
    </section>

    <!-- TO-DO LIST -->
    <section class="card todo-card" aria-label="To-Do List">
      <h2 class="card-title">✅ To-Do List</h2>
      <div class="todo-input-row">
        <input type="text" id="todo-input" class="todo-input" placeholder="Add a new task…" aria-label="New task" maxlength="120" />
        <button id="todo-add-btn" class="btn btn-primary" aria-label="Add task">+ Add</button>
      </div>
      <div class="todo-filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="done">Done</button>
      </div>
      <ul id="todo-list" class="todo-list" aria-label="Task list"></ul>
      <div class="todo-footer">
        <span id="todo-count" class="todo-count">0 tasks left</span>
        <button id="clear-done-btn" class="btn btn-ghost btn-sm">Clear done</button>
      </div>
    </section>

    <!-- QUICK LINKS -->
    <section class="card links-card" aria-label="Quick Links">
      <h2 class="card-title">🔗 Quick Links</h2>
      <div id="links-grid" class="links-grid" role="list"></div>
      <div class="link-add-form">
        <input type="text" id="link-name-input" class="link-input" placeholder="Label (e.g. YouTube)" maxlength="30" aria-label="Link label" />
        <input type="url" id="link-url-input" class="link-input" placeholder="URL (e.g. https://youtube.com)" aria-label="Link URL" />
        <button id="link-add-btn" class="btn btn-primary btn-sm">+ Add Link</button>
      </div>
    </section>

  </main>

  <!-- ========== SETTINGS MODAL ========== -->
  <div id="settings-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Settings" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <h2>⚙️ Settings</h2>
        <button id="settings-close" class="icon-btn modal-close" aria-label="Close settings">✕</button>
      </div>
      <div class="modal-body">
        <label class="setting-label" for="custom-name">
          Your name (for greeting):
          <input type="text" id="custom-name" class="setting-input" placeholder="e.g. Ananda" maxlength="40" />
        </label>
      </div>
      <div class="modal-footer">
        <button id="settings-save" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
